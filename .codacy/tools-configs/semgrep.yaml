rules:
  # ==========================================
  # SQL INJECTION
  # Detects SQL string construction from untrusted input
  # Critical for CMT: processes arbitrary SQL from source databases
  # ==========================================
  - id: java.lang.security.audit.sqli.tainted-sql-from-http-request
    languages:
      - java
    message: >
      Detected input from a servlet request going into a SQL statement.
      This could lead to SQL injection. Use parameterized queries or prepared statements.
    metadata:
      category: security
      cwe:
        - 'CWE-89: Improper Neutralization of Special Elements in an SQL Command'
      owasp:
        - A03:2021 - Injection
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $STMT.executeQuery(...)
              - pattern: $STMT.executeUpdate(...)
              - pattern: $STMT.execute(...)
              - pattern: $CONN.prepareStatement(...)
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getAttribute(...)
    severity: ERROR

  - id: java.lang.security.audit.formatted-sql-string
    languages:
      - java
    message: >
      Detected SQL string formatting using String.format or similar.
      This can lead to SQL injection. Use parameterized queries instead.
    metadata:
      category: security
      cwe:
        - 'CWE-89: SQL Injection'
    pattern-either:
      - pattern: String.format("...", ...)
      - pattern: String.format($SQL, ...)
    severity: WARNING

  - id: java.jboss.security.session_sqli.find-sql-string-concatenation
    languages:
      - java
    message: >
      Detected SQL string concatenation with dynamic content.
      This can lead to SQL injection. Use parameterized queries.
    metadata:
      category: security
      cwe:
        - 'CWE-89: SQL Injection'
    pattern: $SQL + $VAR
    severity: WARNING

  # ==========================================
  # PATH TRAVERSAL / FILE HANDLING
  # Detects unsafe file path construction from untrusted input
  # Critical for CMT: file-based migration scripts and export paths
  # ==========================================
  - id: java.lang.security.httpservlet-path-traversal
    languages:
      - java
    message: >
      Detected potential path traversal vulnerability.
      File paths constructed from user input should be validated to prevent directory traversal attacks.
    metadata:
      category: security
      cwe:
        - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory'
      owasp:
        - A01:2021 - Broken Access Control
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern: new File(...)
          - pattern: new FileInputStream(...)
          - pattern: new FileOutputStream(...)
    pattern-sources:
      - pattern: $REQ.getParameter(...)
    severity: ERROR

  # ==========================================
  # UNSAFE DESERIALIZATION
  # Detects dangerous object deserialization
  # Critical for CMT: migration templates use Java serialization
  # ==========================================
  - id: java.lang.security.insecure-jms-deserialization
    languages:
      - java
    message: >
      Detected JMS ObjectMessage deserialization.
      Deserializing untrusted data can lead to remote code execution.
      Validate data before deserialization or use safe serialization formats.
    metadata:
      category: security
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      owasp:
        - A08:2021 - Software and Data Integrity Failures
    pattern: $MESSAGE.getObject(...)
    severity: WARNING

  - id: java.lang.security.jackson-unsafe-deserialization
    languages:
      - java
    message: >
      Detected Jackson deserialization without type validation.
      Enable default typing only for known safe types.
    metadata:
      category: security
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
    pattern: |
      $MAPPER.enableDefaultTyping(...)
    severity: WARNING

  # ==========================================
  # WEAK CRYPTOGRAPHY
  # Detects use of deprecated or weak cryptographic algorithms
  # Relevant for CMT: database encryption, credential storage
  # ==========================================
  - id: java.lang.security.audit.crypto.use-of-md5
    languages:
      - java
    message: >
      Detected use of MD5 hash algorithm.
      MD5 is cryptographically broken and should not be used for security purposes.
      Use SHA-256 or stronger for hashing.
    metadata:
      category: security
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    pattern: |
      MessageDigest.getInstance("MD5")
    severity: WARNING

  - id: java.lang.security.audit.crypto.use-of-sha1
    languages:
      - java
    message: >
      Detected use of SHA-1 hash algorithm.
      SHA-1 is cryptographically weak and should not be used for security purposes.
      Use SHA-256 or stronger.
    metadata:
      category: security
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    pattern: |
      MessageDigest.getInstance("SHA-1")
    severity: WARNING

  - id: java.lang.security.audit.crypto.use-of-aes-ecb
    languages:
      - java
    message: >
      Detected use of AES with ECB mode.
      ECB mode is insecure as it leaks information about the plaintext.
      Use AES with GCM mode or other secure modes instead.
    metadata:
      category: security
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    pattern: |
      Cipher.getInstance("AES/ECB/...")
    severity: WARNING

  - id: java.lang.security.audit.crypto.use-of-blowfish
    languages:
      - java
    message: >
      Detected use of Blowfish cipher.
      Blowfish has a 64-bit block size which is vulnerable to birthday attacks.
      Use AES instead.
    metadata:
      category: security
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    pattern: |
      Cipher.getInstance("Blowfish")
    severity: WARNING

  - id: java.lang.security.audit.crypto.use-of-rc4
    languages:
      - java
    message: >
      Detected use of RC4 cipher.
      RC4 is cryptographically broken and should never be used.
      Use AES instead.
    metadata:
      category: security
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    pattern: |
      Cipher.getInstance("RC4")
    severity: WARNING

  - id: java.lang.security.audit.crypto.use-of-rc2
    languages:
      - java
    message: >
      Detected use of RC2 cipher.
      RC2 is an outdated algorithm and should not be used.
      Use AES instead.
    metadata:
      category: security
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    pattern: |
      Cipher.getInstance("RC2")
    severity: WARNING

  - id: java.lang.security.audit.crypto.des-is-deprecated
    languages:
      - java
    message: >
      Detected use of DES cipher.
      DES is cryptographically broken (56-bit key) and should not be used.
      Use AES instead.
    metadata:
      category: security
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    pattern: |
      Cipher.getInstance("DES")
    severity: WARNING

  - id: java.lang.security.audit.crypto.weak-rsa
    languages:
      - java
    message: >
      Detected use of weak RSA key size (less than 2048 bits).
      RSA keys should be at least 2048 bits for security.
    metadata:
      category: security
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
    pattern: |
      KeyPairGenerator.getInstance("RSA")
    severity: WARNING

  # ==========================================
  # XXE (XML EXTERNAL ENTITY)
  # Detects unsafe XML parser configurations
  # Relevant for CMT: XML parsing for metadata and templates
  # ==========================================
  - id: java.lang.security.audit.xxe.documentbuilderfactory-disallow-doctype-decl-false
    languages:
      - java
    message: >
      Detected XML parser with DOCTYPE declarations enabled.
      This can lead to XXE (XML External Entity) attacks.
      Disable DOCTYPE declarations: setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
    metadata:
      category: security
      cwe:
        - 'CWE-611: Improper Restriction of XML External Entity Reference'
      owasp:
        - A05:2021 - Security Misconfiguration
    pattern: |
      $FACTORY.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false)
    severity: ERROR

  - id: java.lang.security.xmlinputfactory-possible-xxe
    languages:
      - java
    message: >
      Detected XMLInputFactory without secure configuration.
      Configure XMLInputFactory to prevent XXE attacks by disabling external entities.
    metadata:
      category: security
      cwe:
        - 'CWE-611: Improper Restriction of XML External Entity Reference'
    pattern: XMLInputFactory.newInstance(...)
    severity: WARNING

  # ==========================================
  # COMMAND EXECUTION
  # Minimal: only critical command injection patterns
  # CMT has minimal command execution, but migration scripts may use Runtime.exec
  # ==========================================
  - id: java.lang.security.audit.tainted-cmd-from-http-request
    languages:
      - java
    message: >
      Detected command execution with potentially tainted input.
      Command injection can lead to arbitrary code execution.
      Avoid passing user input to Runtime.exec or ProcessBuilder.
    metadata:
      category: security
      cwe:
        - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command'
      owasp:
        - A03:2021 - Injection
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern: Runtime.getRuntime().exec(...)
          - pattern: new ProcessBuilder(...)
    pattern-sources:
      - pattern: $REQ.getParameter(...)
    severity: ERROR

  # ==========================================
  # CREDENTIAL MISUSE
  # Selective: only rules that add value beyond Trivy secret scanning
  # ==========================================
  - id: java.lang.security.audit.md5-used-as-password
    languages:
      - java
    message: >
      Detected MD5 used for password hashing.
      MD5 is not suitable for password storage as it is too fast and vulnerable to rainbow tables.
      Use bcrypt, scrypt, or Argon2 for password hashing.
    metadata:
      category: security
      cwe:
        - 'CWE-916: Use of Password Hash With Insufficient Computational Effort'
    pattern: |
      MessageDigest.getInstance("MD5")
    severity: WARNING
