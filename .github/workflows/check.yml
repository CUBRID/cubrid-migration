name: github-checks
on:
  pull_request:
    branches:
      - develop
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: license
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
        id: files
        continue-on-error: true
      - name: Check license
        env:
          CHANGED_FILES: "${{ steps.files.outputs.all_changed_files }}"
        run: |
          set +e
          license_headers=.github/workflows/license_headers
          result="PASS"

          # shellcheck disable=SC2086
          for f in $CHANGED_FILES; do
            if [ -d "$f" ]; then
              continue
            fi

            case "$f" in
            *.java) ;;
            *) continue ;;
            esac

            result_for_f="FAIL"
            for header in "$license_headers"/*; do
              [ -f "$header" ] || continue
              line_cnt=$(wc -l < "$header")
              if head -n "$line_cnt" "$f" | diff -q -w - "$header" >/dev/null 2>&1; then
                result_for_f="PASS"
                break
              fi
            done

            echo "$f: $result_for_f"
            if [ "$result_for_f" = "FAIL" ]; then
              result="FAIL"
            fi
          done
          
          test "$result" = "PASS"
  pr-style:
    name: pr-style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: ${{ github.actor != 'dependabot[bot]' }}
        uses: deepakputhraya/action-pr-title@3864bebc79c5f829d25dd42d3c6579d040b0ef16
        with:
          regex: '^\[[A-Z]+-\d+\]\s.+'
      - if: ${{ github.actor == 'dependabot[bot]' }}
        run: echo "pr-style skipped for bot PR"
  code-style:
    name: code-style
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
        with:
          files: |
            **/*.java
          write_output_files: true
      - id: format
        uses: axel-op/googlejavaformat-action@c1134ebd196c4cbffb077f9476585b0be8b6afcd
        if: steps.changed.outputs.any_changed == 'true'
        with:
          release-name: v1.32.0
          args: "--aosp --replace --set-exit-if-changed @.github/outputs/all_changed_files.txt"
          skip-commit: true
      - name: Report required formatting
        if: ${{ failure() && steps.format.outcome == 'failure' }}
        run: |
          echo "::group::Required formatting changes"
          git --no-pager diff
          echo "::endgroup::"
          {
            echo "## Code style check failed"
            echo ""
            echo "Some Java files are not formatted with google-java-format (AOSP)."
            echo "Run the formatter locally on the changed files and commit the result:"
            echo ""
            echo '```bash'
            echo 'java -jar google-java-format-1.32.0-all-deps.jar --aosp --replace <changed .java files>'
            echo '```'
            echo ""
            echo "<details><summary>Required changes (diff)</summary>"
            echo ""
            echo '```diff'
            git --no-pager diff | head -n 800
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
  unit-test:
    name: unit-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests
        run: mvn -B -Punit-test test
