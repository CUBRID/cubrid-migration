name: github-checks
on:
  pull_request:
    branches:
      - develop
      - release/**

jobs:
  license:
    name: license
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      - uses: jitterbit/get-changed-files@v1
        id: files
        continue-on-error: true
      - name: Check license
        run: |
          set +e
          license_headers=.github/workflows/license_headers
          result="PASS"

          for f in ${{ steps.files.outputs.added_modified }}; do
            if [ -d "$f" ]; then
              continue
            fi

            ext=$(expr $f : ".*\(\..*\)")
            case $ext in
            .java) true;;
            *) continue ;;
            esac

            result_for_f="FAIL"
            for header in `find $license_headers -type f`; do
              line_cnt=`wc -l < $header`
              head -n $line_cnt $f | diff -q -w - $header 2>&1 1>/dev/null
              if [ $? -eq 0 ]; then
                result_for_f="PASS"
                break
              fi
            done

            echo "$f: $result_for_f"
            if [ "$result_for_f" = "FAIL" ]; then
              result="FAIL"
            fi
          done
          
          test $result = "PASS"
  pr-style:
    name: pr-style
    runs-on: ubuntu-24.04
    steps:
      - uses: deepakputhraya/action-pr-title@master
        with:
          regex: '^\[[A-Z]+-\d+\]\s.+'
  code-style:
    name: code-style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
        with:
          files: "**/*.java"
          write_output_files: true
      - uses: axel-op/googlejavaformat-action@c1134ebd196c4cbffb077f9476585b0be8b6afcd
        if: ${{ steps.changed.outputs.any_changed == 'true' }}
        with:
          release-name: v1.32.0
          args: "--aosp --replace --set-exit-if-changed @.github/outputs/all_changed_files.txt"
          files-excluded: "**/*"
          skip-commit: true
      - name: Suggest code changes
        if: ${{ failure() }}
        uses: reviewdog/action-suggester@aa38384ceb608d00f84b4690cacc83a5aba307ff
        with:
          tool_name: code-style (indent, googlejavaformat)
