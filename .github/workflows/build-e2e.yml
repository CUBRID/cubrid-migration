name: Build & E2E

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-desktop:
    name: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Desktop
        run: chmod +x build.sh && ./build.sh -p d

  build-console:
    name: build-console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Console
        run: chmod +x build.sh && ./build.sh -p c

      - name: Upload Console tarball
        uses: actions/upload-artifact@v4
        with:
          name: cmt-console-tarball
          path: target/CUBRID-Migration-Toolkit-console-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  e2e-test:
    name: e2e-test
    needs: build-console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download Console tarball
        uses: actions/download-artifact@v4
        with:
          name: cmt-console-tarball
          path: target

      - name: Provision Console
        run: |
          mkdir -p cmt-console
          tar xzf target/CUBRID-Migration-Toolkit-console-*.tar.gz \
            --strip-components=1 -C cmt-console
          chmod +x cmt-console/migration.sh
          echo "CMT_CONSOLE_HOME=$GITHUB_WORKSPACE/cmt-console" >> $GITHUB_ENV

      - name: Run E2E Tests
        working-directory: tests/e2e
        env:
          NO_COLOR: '1'
          CLICOLOR: '0'
          TERM: dumb
          # Oracle 11g XE tz file (v4) → ORA-01882 on newer region IDs
          # unless ojdbc sends UTC offset. Required for CMT subprocess.
          JAVA_TOOL_OPTIONS: -Doracle.jdbc.timezoneAsRegion=false
        run: |
          mvn -B clean test \
            -Dmaven.test.failure.ignore=true \
            -Dpicocli.ansi=false \
            -Dorg.fusesource.jansi.Ansi.disable=true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040  # v2.23.0
        if: always()
        with:
          check_name: E2E Test Results
          files: tests/e2e/target/surefire-reports/*.xml
          # 'failures' keeps the PR conversation clean.
          comment_mode: failures
          report_individual_runs: true
          check_run_annotations: all tests, skipped tests
          action_fail: true
          action_fail_on_inconclusive: true

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tests/e2e/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload E2E Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: tests/e2e/target/e2e/**
          if-no-files-found: ignore
