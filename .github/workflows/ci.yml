name: CI

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Desktop
        run: chmod +x build.sh && ./build.sh -p d

  build-console:
    name: build-console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Console
        run: chmod +x build.sh && ./build.sh -p c

      - name: Upload Console tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cmt-console-tarball
          path: target/CUBRID-Migration-Toolkit-console-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  e2e-test:
    name: e2e-${{ matrix.name }}
    needs: build-console
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oracle
            tests: 'OracleTo*Test'
          - name: cubrid
            tests: 'CubridTo*Test'
          - name: mysql
            tests: 'MySqlTo*Test'
          - name: mariadb
            tests: 'MariaDbTo*Test'
          - name: informix
            tests: 'InformixTo*Test'
          - name: mssql
            tests: 'MsSqlTo*Test'
          - name: cli
            tests: 'Cli*Test'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download Console tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cmt-console-tarball
          path: target

      - name: Provision Console
        run: |
          mkdir -p cmt-console
          tar xzf target/CUBRID-Migration-Toolkit-console-*.tar.gz \
            --strip-components=1 -C cmt-console
          chmod +x cmt-console/migration.sh
          echo "CMT_CONSOLE_HOME=$GITHUB_WORKSPACE/cmt-console" >> "$GITHUB_ENV"

      - name: Run E2E Tests (${{ matrix.name }})
        working-directory: tests/e2e
        env:
          NO_COLOR: '1'
          CLICOLOR: '0'
          TERM: dumb
          # Oracle 11g XE tz file (v4) → ORA-01882 on newer region IDs
          # unless ojdbc sends UTC offset. Required for CMT subprocess.
          JAVA_TOOL_OPTIONS: -Doracle.jdbc.timezoneAsRegion=false
          TEST_PATTERN: ${{ matrix.tests }}
        run: |
          mvn -B clean test \
            -Dtest="$TEST_PATTERN" \
            -Dpicocli.ansi=false \
            -Dorg.fusesource.jansi.Ansi.disable=true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: always()
        continue-on-error: true
        with:
          check_name: E2E Results (${{ matrix.name }})
          files: tests/e2e/target/surefire-reports/*.xml
          comment_mode: failures
          report_individual_runs: true
          check_run_annotations: all tests, skipped tests
          action_fail: false
          action_fail_on_inconclusive: false

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: surefire-reports-${{ matrix.name }}
          path: tests/e2e/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload E2E Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-failure-artifacts-${{ matrix.name }}
          path: tests/e2e/target/e2e/**
          if-no-files-found: ignore
